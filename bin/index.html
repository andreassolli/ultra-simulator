<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultra Speaker simulator (Ruffle)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* the player fills the window; the SWF uses StageScaleMode.SHOW_ALL so the 960x500 game scales to fit */
  #c { position: fixed; inset: 0; }
  ruffle-player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="c"></div>
<script>
  window.RufflePlayer = { config: { autoplay: "on", splashScreen: false, unmuteOverlay: "hidden",
    allowScriptAccess: true, warnOnUnsupportedContent: false, letterbox: "on" } };
</script>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
  // FlashVars come from this page's query string (e.g. index.html?class=ap&bot=1)
  const player = window.RufflePlayer.newest().createPlayer();
  document.getElementById("c").appendChild(player);
  player.load({ url: "ultra_sim.swf", parameters: location.search.slice(1) });
  // Full screen: the game's "Fullscreen (F)" button and F key call this (a SWF cannot enter browser full screen itself in Ruffle)
  window.toggleGameFullscreen = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
    return true;
  };
</script>
</body>
</html>
