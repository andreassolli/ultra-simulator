<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultra simulator (Ruffle, offline)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #c { position: fixed; left: 0; top: 0; transform-origin: 0 0; }
  ruffle-player { width: 100%; height: 100%; }
  #warn { display: none; position: fixed; inset: 0; color: #fff; padding: 40px; font-size: 18px; line-height: 1.5; }
  #warn code { background: #222; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="c"></div>
<div id="warn">
  <h2>Start the game through the little web server</h2>
  <p>Browsers do not let a page opened from a file load the game's other files (the maps, bosses and items).<br>
  Run <code>python3 serve.py</code> (or double-click <code>serve.py</code>) in this folder; it opens this page at <code>http://localhost:8000/play.html</code>.</p>
</div>
<!-- Ruffle itself is in ./ruffle (nothing is downloaded) -->
<script>
  window.RufflePlayer = { config: { autoplay: "on", splashScreen: false, unmuteOverlay: "hidden",
    allowScriptAccess: true, warnOnUnsupportedContent: false, letterbox: "on" } };
  // rq = Ruffle's quality (low | medium | high | best), res = render resolution factor (see below)
  const urlOpts = new URLSearchParams(location.search);
  if (urlOpts.get("rq")) { window.RufflePlayer.config.quality = urlOpts.get("rq"); }
  if (location.protocol === "file:") { document.getElementById("warn").style.display = "block"; }
</script>
<script src="ruffle/ruffle.js"></script>
<script src="discord/config.js"></script>
<script>
  // Options go in the address: play.html?boss=drakath&class=lr&bot=1&speed=4&hints=0&autoplay=1
  // boss = speaker | dage | drakath, class = loo | ap | lr | ca | pc
  if (location.protocol !== "file:") {
    const player = window.RufflePlayer.newest().createPlayer();
    window.player = player;
    document.getElementById("c").appendChild(player);
    // Render resolution: the player is laid out smaller and scaled up by the browser, so a big window or a hi-dpi screen does
    // not mean millions of pixels for the GPU. Default: at most about 1280 pixels wide; ?res=1 for full resolution, ?res=0.5 for less.
    const box = document.getElementById("c");
    const fitGame = () => {
      let res = parseFloat(urlOpts.get("res"));
      if (!(res > 0)) res = Math.min(1, 1280 / (window.innerWidth * (window.devicePixelRatio || 1)));
      box.style.width = Math.round(window.innerWidth * res) + "px";
      box.style.height = Math.round(window.innerHeight * res) + "px";
      box.style.transform = "scale(" + (1 / res) + ")";
    };
    fitGame();
    window.addEventListener("resize", fitGame);
    // Inside a Discord Activity (Discord adds ?frame_id=... to the address) the Embedded App SDK has to say it is ready
    if (urlOpts.has("frame_id")) {
      const sdkScript = document.createElement("script");
      sdkScript.src = "discord/discord-sdk.js";
      sdkScript.onload = async () => {
        try {
          const sdk = new window.DiscordSDK(window.DISCORD_CLIENT_ID);
          await sdk.ready();
          window.discordSdk = sdk;
        } catch (e) { console.error("Discord SDK:", e); }
      };
      document.head.appendChild(sdkScript);
    }
    // keyboard focus from the start: the keys work without a first click
    player.setAttribute("tabindex", "0");
    const focusGame = () => { try { player.focus(); } catch (e) {} };
    focusGame();
    const focusTimer = setInterval(focusGame, 250);
    setTimeout(() => clearInterval(focusTimer), 30000);
    window.addEventListener("focus", focusGame);
    window.addEventListener("pointerdown", () => setTimeout(focusGame, 0));
    player.load({ url: "ultra_sim.swf", parameters: location.search.slice(1) });
    // the game's Fullscreen button / F key call this
    window.toggleGameFullscreen = function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
      return true;
    };
  }
</script>
</body>
</html>
